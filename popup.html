<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    h1 {
      margin: 0 0 10px 0;
      font-size: 20px;
      font-weight: 600;
    }
    
    p {
      margin: 0 0 20px 0;
      font-size: 13px;
      opacity: 0.9;
      line-height: 1.5;
    }
    
    .toggle-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
      border-radius: 28px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #4CAF50;
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    .stats {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }
    
    .stats-number {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    .stats-label {
      font-size: 12px;
      opacity: 0.8;
    }
    
    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>🛑 Anti-Doom Scroll</h1>
  <p>Browse search results freely, but stay focused when viewing individual posts</p>
  
  <div class="toggle-container">
    <div class="toggle-row">
      <span class="toggle-label">Protection Enabled</span>
      <label class="switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div class="stats">
    <div class="stats-number" id="scrollsBlocked">0</div>
    <div class="stats-label">Scroll attempts blocked today</div>
  </div>
  
  <div class="footer">
    Take back control of your time ⏰
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
